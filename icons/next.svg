<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
    <g fill="none" stroke="hsl(200, 80%, 55%)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">

        <!-- two vertical bars (mirrored to the left) -->
        <path d="M5.2 2.0v12"/>
        <path d="M2.2 2.0v12"/>

        <!-- right-pointing triangle reaching full height of inner bar -->
